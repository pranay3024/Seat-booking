{% extends "base.html" %}
{% block title %}{{ 'Edit show' if editing else 'New show' }}{% endblock %}
{% block content %}
<div class="narrow">
  <a class="back" href="{{ url_for('seat_map', show_id=show.id) if editing else url_for('dashboard') }}">← Back</a>
  <h1>{{ 'Edit show' if editing else 'New show' }}</h1>
  <form class="card form-card" method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="field">
      <span>Show / event name *</span>
      <input name="title" value="{{ show.title or '' }}" required placeholder="e.g. Annual Day 2026">
    </label>
    <label class="field">
      <span>Venue</span>
      <input name="venue" value="{{ show.venue or '' }}" placeholder="e.g. Main Auditorium">
    </label>
    <div class="row2">
      <label class="field">
        <span>Date *</span>
        <input type="date" name="show_date" value="{{ show.show_date or '' }}" required>
      </label>
      <label class="field">
        <span>Time</span>
        <input type="time" name="show_time" value="{{ show.show_time or '' }}">
      </label>
    </div>
    <label class="field">
      <span>Notes</span>
      <textarea name="notes" rows="3" placeholder="Anything the team should know">{{ show.notes or '' }}</textarea>
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">{{ 'Save changes' if editing else 'Create show' }}</button>
    </div>
  </form>

  {% if editing %}
  <form class="card danger-zone" method="post" action="{{ url_for('show_delete', show_id=show.id) }}"
        onsubmit="return confirm('Delete this show and ALL its bookings? This cannot be undone.');">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div>
      <b>Delete show</b>
      <p class="muted small">Removes the show and every booking for it.</p>
    </div>
    <button class="btn btn-danger" type="submit">Delete</button>
  </form>
  {% endif %}
</div>
{% endblock %}
